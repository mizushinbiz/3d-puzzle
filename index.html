<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>3D パズル 6x6x6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-layer">
    <div id="start-menu" class="panel">
      <h1>3Dパズル 6x6x6</h1>
      <p>4つ揃えれば勝ち！（立体四目並べ）</p>
      <button id="btn-pvp">人間 vs 人間</button>
      <button id="btn-pvc">人間 vs CPU</button>
    </div>
    
    <div id="game-ui" class="hidden">
      <div id="status-bar">
        <span id="turn-indicator">プレイヤー1のターン</span>
      </div>
      <div id="controls">
        <button id="btn-cancel" disabled>キャンセル</button>
        <button id="btn-decide" disabled>決定</button>
      </div>
    </div>

    <div id="result-panel" class="panel hidden">
      <h2 id="result-text"></h2>
      <button id="btn-restart">もう一度遊ぶ</button>
    </div>

    <!-- カメラ・視点操作パネル -->
    <div id="camera-panel" class="camera-panel">
      <div class="camera-panel-header">
        <span class="camera-panel-title">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          カメラ視点操作
        </span>
        <button id="btn-toggle-cam-panel" class="icon-toggle-btn" title="折りたたみ / 展開" aria-label="パネルを折りたたむ">−</button>
      </div>

      <div id="camera-panel-body" class="camera-panel-body">
        <!-- 拡大・縮小 -->
        <div class="cam-section">
          <div class="cam-section-label">拡大・縮小</div>
          <div class="cam-btn-row">
            <button class="cam-btn" data-action="zoomIn" title="拡大 (+ / Q / PageUp)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
              <span>拡大</span>
            </button>
            <button class="cam-btn" data-action="zoomOut" title="縮小 (- / E / PageDown)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
              <span>縮小</span>
            </button>
          </div>
        </div>

        <!-- 視点回転 -->
        <div class="cam-section">
          <div class="cam-section-label">視点の回転</div>
          <div class="cam-dpad">
            <button class="cam-btn dpad-btn dpad-up" data-action="rotateUp" title="見下ろす (キー: ↑)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </button>
            <div class="dpad-row">
              <button class="cam-btn dpad-btn dpad-left" data-action="rotateLeft" title="左回転 (キー: ←)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <button class="cam-btn dpad-btn dpad-center" id="btn-cam-reset" title="初期視点に戻す (キー: R)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <button class="cam-btn dpad-btn dpad-right" data-action="rotateRight" title="右回転 (キー: →)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
            <button class="cam-btn dpad-btn dpad-down" data-action="rotateDown" title="見上げる (キー: ↓)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- 位置移動（パン） -->
        <div class="cam-section">
          <div class="cam-section-label">縦横の位置移動</div>
          <div class="cam-dpad">
            <button class="cam-btn dpad-btn dpad-up" data-action="panUp" title="上に移動 (キー: W / Shift+↑)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
            <div class="dpad-row">
              <button class="cam-btn dpad-btn dpad-left" data-action="panLeft" title="左に移動 (キー: A / Shift+←)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
              </button>
              <div class="dpad-center-tag">移動</div>
              <button class="cam-btn dpad-btn dpad-right" data-action="panRight" title="右に移動 (キー: D / Shift+→)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
            <button class="cam-btn dpad-btn dpad-down" data-action="panDown" title="下に移動 (キー: S / Shift+↓)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- キーボード操作ガイド -->
        <div class="cam-guide">
          <div class="cam-guide-title">キーボード操作対応</div>
          <ul>
            <li><span>矢印キー</span>: 回転</li>
            <li><span>W A S D</span>: 位置移動</li>
            <li><span>+ / - / Q / E</span>: 拡大縮小</li>
            <li><span>R</span>: 初期視点リセット</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Three.js は ES Modules で読み込みます -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
